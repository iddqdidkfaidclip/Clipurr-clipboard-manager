name: Clipurr
options:
  bundleIdPrefix: com.clipurr
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: 1.1.2
targets:
  Clipurr:
    type: application
    platform: macOS
    sources:
      - path: Clipurr
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipurr.app
        PRODUCT_NAME: Clipurr
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Clipurr
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Clipurr uses System Events to paste the selected clipboard item into the app you were using.
        # Sparkle keys live in Info.plist (INFOPLIST_KEY_* strips unknown SU* keys).
        INFOPLIST_FILE: Clipurr/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Clipurr/Clipurr.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - ClipurrTests
  ClipurrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipurrTests
    dependencies:
      - target: Clipurr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipurr.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clipurr:
    build:
      targets:
        Clipurr: all
        ClipurrTests:
          - test
    test:
      targets:
        - ClipurrTests
